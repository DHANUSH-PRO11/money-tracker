<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyFlow Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif;">
  <div style="text-align: center; padding: 40px; background: var(--card); border-radius: 20px; box-shadow: 0 4px 16px var(--shadow);">
    <h1 style="font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2rem; margin-bottom: 20px; color: var(--text);">₹ MoneyFlow</h1>
    <p style="color: var(--muted); margin-bottom: 30px;">Personal Finance Tracker</p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <button onclick="window.location.href='login.html'" style="background: var(--gradient); color: white; border: none; padding: 12px 32px; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease;">
        Login
      </button>
      <button onclick="window.location.href='signup.html'" style="background: var(--card); color: var(--text); border: 2px solid var(--border); padding: 12px 32px; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease;">
        Sign Up
      </button>
      <button onclick="window.location.href='index.html'" style="background: var(--a3); color: white; border: none; padding: 12px 32px; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease;">
        Skip to App
      </button>
    </div>
  </div>
</div>
</body>
</html>
