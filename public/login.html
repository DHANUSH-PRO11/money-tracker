<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MoneyFlow Tracker</title>
<link rel="stylesheet" href="styles.css">
<style>
.login-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 20px;
}

.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.login-header {
  text-align: center;
  margin-bottom: 30px;
}

.login-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.8rem;
  background: linear-gradient(135deg,var(--a1),var(--a2));
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.login-subtitle {
  color: var(--muted);
  font-size: 0.9rem;
}

.fld {
  margin-bottom: 20px;
}

.fld label {
  display: block;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 8px;
}

.fld input {
  width: 100%;
  background: #0f0f17;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 12px 16px;
  font-family: 'DM Mono', monospace;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}

.fld input:focus {
  outline: none;
  border-color: var(--a1);
}

.btn-login {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: linear-gradient(135deg,var(--a1),var(--a2));
  color: #fff;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 0.88rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: opacity 0.2s, transform 0.15s;
  margin-bottom: 20px;
}

.btn-login:hover {
  opacity: 0.85;
  transform: scale(1.01);
}

.btn-login:active {
  transform: scale(0.98);
}

.login-footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
}

.login-footer a {
  color: var(--a1);
  text-decoration: none;
  font-weight: 500;
}

.login-footer a:hover {
  text-decoration: underline;
}

.error-message {
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 0.8rem;
  text-align: center;
}

.success-message {
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid var(--green);
  color: var(--green);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 0.8rem;
  text-align: center;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">₹ MoneyFlow</div>
      <div class="login-subtitle">Sign in to your account</div>
    </div>
    
    <div id="message"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="fld">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      
      <div class="fld">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" class="btn-login">Sign In</button>
    </form>
    
    <div class="login-footer">
      Don't have an account? <a href="signup.html">Sign up here</a>
    </div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
