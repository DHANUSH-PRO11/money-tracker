<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — MoneyFlow Tracker</title>
<meta name="description" content="Sign in to your MoneyFlow account to track income and expenses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #0a0f1e;
  --card:    rgba(22, 30, 54, 0.9);
  --border:  rgba(255,255,255,0.08);
  --a1:      #8b5cf6;
  --a2:      #ec4899;
  --text:    #f8fafc;
  --muted:   #94a3b8;
  --green:   #10b981;
  --red:     #f43f5e;
  --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
}

body {
  min-height: 100vh;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(236,72,153,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 90%, rgba(16,185,129,0.06) 0%, transparent 40%);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

/* Animated background dots */
.bg-dots {
  position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

.wrapper {
  position: relative; z-index: 1;
  width: 100%; max-width: 440px;
}

/* Logo strip above card */
.brand {
  text-align: center; margin-bottom: 28px;
}
.brand-logo {
  font-family: 'Outfit', sans-serif;
  font-weight: 800; font-size: 2rem;
  background: var(--gradient);
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
  display: inline-block;
}
.brand-tagline {
  color: var(--muted); font-size: 0.85rem; margin-top: 6px;
}

/* Card */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 32px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
  animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)   scale(1); }
}

.card-title {
  font-family: 'Outfit', sans-serif;
  font-weight: 700; font-size: 1.5rem;
  margin-bottom: 6px;
}
.card-sub {
  color: var(--muted); font-size: 0.875rem; margin-bottom: 24px;
}

/* Google Sign-in Button */
.btn-google {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.25s ease;
  margin-bottom: 4px;
}
.btn-google:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
.btn-google:active { transform: translateY(0); }
.btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-google svg { flex-shrink: 0; }

/* Fields */
.fld { margin-bottom: 20px; }
.fld label {
  display: block; font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 8px;
  font-family: 'Outfit', sans-serif;
}
.input-wrap { position: relative; }
.input-wrap .input-icon {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%); font-size: 1rem;
  pointer-events: none;
}
.fld input {
  width: 100%;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  padding: 14px 16px 14px 44px;
  font-family: 'Inter', sans-serif; font-size: 0.95rem;
  transition: all 0.25s ease;
}
.fld input.has-toggle {
  padding-right: 46px;
}
.input-wrap .toggle-pwd {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: transparent; border: none;
  color: var(--muted); cursor: pointer;
  padding: 6px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, background 0.2s, transform 0.15s;
}
.input-wrap .toggle-pwd:hover {
  color: var(--text);
  background: rgba(255,255,255,0.08);
}
.input-wrap .toggle-pwd:active {
  transform: translateY(-50%) scale(0.92);
}
.fld input:focus {
  outline: none; border-color: var(--a1);
  box-shadow: 0 0 0 4px rgba(139,92,246,0.15);
  background: rgba(0,0,0,0.35);
}
.fld input::placeholder { color: rgba(148,163,184,0.5); }

/* Error / success messages */
#message { margin-bottom: 20px; }
.error-msg {
  background: rgba(244,63,94,0.1);
  border: 1px solid rgba(244,63,94,0.4);
  color: var(--red); padding: 12px 16px;
  border-radius: 10px; font-size: 0.875rem;
  display: flex; align-items: center; gap: 8px;
}
.success-msg {
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.4);
  color: var(--green); padding: 12px 16px;
  border-radius: 10px; font-size: 0.875rem;
}

/* Submit button */
.btn-submit {
  width: 100%; padding: 15px; border: none; border-radius: 12px;
  cursor: pointer; background: var(--gradient); color: white;
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.95rem;
  letter-spacing: 0.05em; text-transform: uppercase;
  transition: all 0.25s ease;
  box-shadow: 0 8px 20px rgba(139,92,246,0.3);
  margin-top: 4px;
  position: relative; overflow: hidden;
}
.btn-submit::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.25s;
}
.btn-submit:hover::after { opacity: 1; }
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(236,72,153,0.4); }
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Divider */
.divider {
  display: flex; align-items: center; gap: 16px;
  margin: 20px 0; color: var(--muted); font-size: 0.8rem;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}

/* Footer link */
.card-footer {
  text-align: center; color: var(--muted);
  font-size: 0.875rem; margin-top: 24px;
}
.card-footer a {
  color: var(--a1); text-decoration: none; font-weight: 600;
  transition: color 0.2s;
}
.card-footer a:hover { color: var(--a2); }

/* Stats strip */
.stats-strip {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px; margin-top: 28px;
}
.stat-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 12px; text-align: center;
}
.stat-num {
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.4rem;
  background: var(--gradient); background-clip: text;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-weight: 500; }
</style>
</head>
<body>

<div class="bg-dots"></div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-logo">₹ MoneyFlow</div>
    <div class="brand-tagline">Your personal finance tracker</div>
  </div>

  <div class="card">
    <div class="card-title">Welcome back 👋</div>
    <div class="card-sub">Sign in to your account to continue</div>

    <div id="message"></div>

    <button type="button" class="btn-google" id="google-btn" onclick="handleGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="divider"><span>or sign in with email</span></div>

    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
      <div class="fld">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">📧</span>
          <input type="email" id="email" name="email"
            placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="fld">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password"
            placeholder="Your password" required autocomplete="current-password" class="has-toggle">
          <button type="button" class="toggle-pwd" onclick="togglePassword('password', this)" title="Show password" aria-label="Show password">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
    </form>

    <div class="card-footer">
      Don't have an account? <a href="signup.html">Create one free →</a>
    </div>
  </div>

  <div class="stats-strip">
    <div class="stat-item">
      <div class="stat-num">∞</div>
      <div class="stat-label">Transactions</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">📊</div>
      <div class="stat-label">Charts</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">🔒</div>
      <div class="stat-label">Secure</div>
    </div>
  </div>
</div>

<script>
  let supabaseAuthClient = null;
  let isGoogleAuthProcessing = false;

  // Immediately redirect if token already exists
  if (localStorage.getItem('token')) {
    window.location.replace('/index.html');
  }

  // Initialize Supabase OAuth
  async function initSupabase() {
    try {
      let config = {};
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          config = await res.json();
        }
      } catch (fetchErr) {
        console.warn('Could not fetch /api/config, using default configuration');
      }

      const supUrl = config.supabaseUrl || 'https://oxpcbbxxtncvsvycawvm.supabase.co';
      const supKey = config.supabaseAnonKey || 'sb_publishable_Zv8bmJAMfPvtDQup1wNCHw_dM9asX8u';

      if (supUrl && supKey && window.supabase) {
        supabaseAuthClient = window.supabase.createClient(supUrl, supKey);

        // Check if returning from Google OAuth redirect
        const { data: { session }, error } = await supabaseAuthClient.auth.getSession();
        if (session && session.user) {
          await handleGoogleSession(session.user);
        }

        supabaseAuthClient.auth.onAuthStateChange(async (event, session) => {
          if (event === 'SIGNED_IN' && session?.user) {
            await handleGoogleSession(session.user);
          }
        });
      }
    } catch (err) {
      console.warn('Could not load Supabase auth config:', err);
    }
  }

  let isGoogleAuthInProgress = false;

  // Handle Google OAuth session
  async function handleGoogleSession(googleUser) {
    if (isGoogleAuthProcessing) return;
    isGoogleAuthProcessing = true;

    // Clean up URL hash so page looks clean
    if (window.location.hash) {
      window.history.replaceState(null, '', window.location.pathname);
    }

    const msgEl = document.getElementById('message');
    const googleBtn = document.getElementById('google-btn');
    if (googleBtn) {
      googleBtn.disabled = true;
      googleBtn.innerHTML = '<span>Signing in with Google…</span>';
    }

    msgEl.innerHTML = '<div class="success-msg">🔄 Authenticating with Google…</div>';

    const email = googleUser.email;
    const name = googleUser.user_metadata?.full_name || googleUser.user_metadata?.name || email.split('@')[0];
    const avatar = googleUser.user_metadata?.avatar_url || '';

    try {
      let data = null;
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name, avatar })
        });
        if (res.ok) {
          data = await res.json();
        }
      } catch (backendErr) {
        console.warn('Backend sync note:', backendErr);
      }

      const token = data?.token || ('google_session_' + Date.now());
      const user = data?.user || { id: 1, name, email };

      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(user));
      msgEl.innerHTML = '<div class="success-msg">✅ Signed in with Google! Opening dashboard…</div>';

      setTimeout(() => {
        window.location.replace('/index.html');
      }, 300);
    } catch (err) {
      console.error('Google auth error:', err);
      isGoogleAuthProcessing = false;
      msgEl.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
      if (googleBtn) {
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Continue with Google</span>`;
      }
    }
  }

  // Trigger Google Login
  async function handleGoogleAuth() {
    const btn = document.getElementById('google-btn');
    const msgEl = document.getElementById('message');

    if (!supabaseAuthClient) {
      msgEl.innerHTML = '<div class="error-msg">⚠️ Supabase is not configured yet. Please check your credentials.</div>';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span>Connecting to Google…</span>';
    msgEl.innerHTML = '';

    try {
      const { data, error } = await supabaseAuthClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/login.html'
        }
      });

      if (error) throw error;
    } catch (err) {
      msgEl.innerHTML = `<div class="error-msg">❌ Google sign-in error: ${err.message}</div>`;
      btn.disabled = false;
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>`;
    }
  }

  // Toggle password visibility
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    const openEye = btn.querySelector('.eye-open');
    const closedEye = btn.querySelector('.eye-closed');
    if (openEye && closedEye) {
      openEye.style.display = isPwd ? 'none' : 'block';
      closedEye.style.display = isPwd ? 'block' : 'none';
    }
    btn.title = isPwd ? 'Hide password' : 'Show password';
    btn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submit-btn');
    const msgEl    = document.getElementById('message');

    if (!email || !password) {
      msgEl.innerHTML = '<div class="error-msg">⚠️ Please fill in both fields</div>';
      return;
    }

    btn.disabled = true; btn.textContent = 'Signing in…';
    msgEl.innerHTML = '';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      msgEl.innerHTML = '<div class="success-msg">✅ Signed in! Redirecting…</div>';
      setTimeout(() => window.location.replace('/index.html'), 400);
    } catch (err) {
      msgEl.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  // Initialize on page load
  window.addEventListener('DOMContentLoaded', initSupabase);
</script>
</body>
</html>
